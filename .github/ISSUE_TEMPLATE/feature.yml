name: ✨ 功能请求 / Feature request
description: 新功能建议、交互改进、适配新 DSH 版本
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到什么问题 / 场景
      description: 描述痛点，而不是直接给方案（方案可以放下一栏）
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方式
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / 其他考虑
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 现有插件增强
        - 新增插件
        - 仓库/CI/文档