name: publish

# Trusted Publishing（OIDC）发布会：无需长期 npm token
# 前置：每个包的 npm Settings → Trusted publishing 已配置（GitHub Actions / Fanlr1 / dsh-plugins / publish.yml）
# 触发：打 tag（v*）或手动 workflow_dispatch

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write   # OIDC（Trusted Publishing 必需）
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - multi-edit
          - bash
          - loop-guard
          - hub-finder
          - session-tidy
          - hw-monitor
          - deepseek-balance
          - goal-fold
          - queue-fold
          - chat-zoom
          - chat-user-edit
          - hide-update-retry
          - github-tools
          - scoped-instructions
          - runtime-log
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Decide whether to publish
        id: decide
        working-directory: packages/${{ matrix.package }}
        run: |
          set -e
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          if ! npm view "$PKG" version >/dev/null 2>&1; then
            echo "action=skip-first-release" >> "$GITHUB_OUTPUT"
            echo "跳过 $PKG：包尚未发布到 npm（需先手动首发一次并配置 trusted publisher）"
          elif npm view "$PKG@$VER" version >/dev/null 2>&1; then
            echo "action=skip-exists" >> "$GITHUB_OUTPUT"
            echo "跳过 $PKG@$VER：该版本已存在于 npm"
          else
            echo "action=publish" >> "$GITHUB_OUTPUT"
            echo "将发布 $PKG@$VER"
          fi

      - name: Publish (OIDC)
        if: steps.decide.outputs.action == 'publish'
        working-directory: packages/${{ matrix.package }}
        run: npm publish --access public --provenance
